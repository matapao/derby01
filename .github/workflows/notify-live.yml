name: Notify live revision
on:
  workflow_run:
    workflows: ['Playable build']
    branches: [main]
    types: [completed]
permissions: {}
jobs:
  notify:
    if: >-
      vars.ZIRBEL_LIVE == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: game-publication
    steps:
      - name: Mint matapao-app token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.ZIRBEL_DISPATCH_APP_ID }}
          private-key: ${{ secrets.ZIRBEL_DISPATCH_APP_PRIVATE_KEY }}
          owner: matapao
          repositories: zirbel
          permission-actions: write
      - name: Dispatch Zirbel cartridge import
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh workflow run import-game.yml --repo matapao/zirbel --ref main -f game=derby01 -f run="$RUN_ID"
